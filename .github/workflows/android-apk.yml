name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify APK alignment and signature
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-Measure-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
